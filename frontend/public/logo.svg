<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield Container -->
  <rect x="6" y="6" width="88" height="88" rx="24" fill="url(#logo-grad)" />
  <rect x="8" y="8" width="84" height="84" rx="22" stroke="rgba(255,255,255,0.3)" stroke-width="2" />

  <!-- Inner Dark Core for High Contrast -->
  <rect x="12" y="12" width="76" height="76" rx="18" fill="#090d16" />

  <!-- Background Cyber Circuit Grid Lines -->
  <path d="M 28 50 L 72 50" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" stroke-dasharray="2 3" />
  <path d="M 50 28 L 50 72" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" stroke-dasharray="2 3" />
  <circle cx="50" cy="50" r="22" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1.5" fill="none" />

  <!-- PulseHR Dynamic EKG AI Waveform (Center) -->
  <path d="M 24 50 L 36 50 L 42 32 L 50 68 L 58 38 L 64 50 L 76 50" 
        stroke="url(#logo-grad)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)" />

  <!-- Glowing Neural Nodes -->
  <circle cx="42" cy="32" r="3.5" fill="#38bdf8" />
  <circle cx="50" cy="68" r="3.5" fill="#818cf8" />
  <circle cx="58" cy="38" r="3.5" fill="#06b6d4" />

  <!-- Top Ambient Sparkle Point -->
  <circle cx="50" cy="22" r="2" fill="#ffffff" opacity="0.9" />
</svg>
